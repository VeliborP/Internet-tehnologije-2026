# ===================================================================
# Web Shop - application configuration (example / development defaults)
# Values can be overridden with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
# ===================================================================

spring.application.name=webshop
server.port=8080

# --- Encoding (UTF-8 everywhere: č, ć, š, ž, đ) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.thymeleaf.encoding=UTF-8
# Disable template caching during development; set to true in production.
spring.thymeleaf.cache=false

# --- MySQL connection ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webshop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.pool-name=WebShopPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
# update   = Hibernate creates/updates tables automatically (development default)
# validate = use together with database/schema.sql (recommended for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- File upload (product images) ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Directory (outside of the classpath) where uploaded images are stored.
app.upload.dir=uploads

# --- Security ---
# plain  = passwords are stored as plain text (DEVELOPMENT / TEST ONLY, as required by the assignment)
# bcrypt = passwords are hashed with BCrypt (use this for production)
app.security.password-encoding=plain

# --- Seed data ---
# Creates the initial ADMIN account and demo catalog on startup when the database is empty.
app.seed.enabled=true
