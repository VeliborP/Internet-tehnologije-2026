<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{register.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card auth-card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4" th:text="#{register.heading}">Registracija</h1>
                    <form method="post" th:action="@{/register}" th:object="${registrationForm}" novalidate>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Greška</div>
                        </div>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="firstName" th:text="#{field.first.name}">Ime</label>
                                <input class="form-control" id="firstName" type="text" th:field="*{firstName}"
                                       th:errorclass="is-invalid" autocomplete="given-name">
                                <div class="invalid-feedback" th:errors="*{firstName}">Greška</div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="lastName" th:text="#{field.last.name}">Prezime</label>
                                <input class="form-control" id="lastName" type="text" th:field="*{lastName}"
                                       th:errorclass="is-invalid" autocomplete="family-name">
                                <div class="invalid-feedback" th:errors="*{lastName}">Greška</div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="username" th:text="#{field.username}">Korisničko ime</label>
                                <input class="form-control" id="username" type="text" th:field="*{username}"
                                       th:errorclass="is-invalid" autocomplete="username">
                                <div class="invalid-feedback" th:errors="*{username}">Greška</div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="password" th:text="#{field.password}">Lozinka</label>
                                <input class="form-control" id="password" type="password" th:field="*{password}"
                                       th:errorclass="is-invalid" autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{password}">Greška</div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="confirmPassword" th:text="#{field.password.confirm}">Potvrda lozinke</label>
                                <input class="form-control" id="confirmPassword" type="password"
                                       th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{confirmPassword}">Greška</div>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100 mt-4" type="submit" th:text="#{register.submit}">Registruj se</button>
                    </form>
                    <p class="text-center mt-4 mb-0">
                        <span th:text="#{register.have.account}">Već imate nalog?</span>
                        <a th:href="@{/login}" th:text="#{register.login.link}">Prijavite se</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
