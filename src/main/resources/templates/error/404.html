<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.404.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="empty-state">
        <span class="error-code">404</span>
        <h1 class="h3" th:text="#{error.404.heading}">Stranica nije pronađena</h1>
        <p th:text="${errorDetail != null} ? ${errorDetail} : #{error.404.text}">Tražena stranica ne postoji.</p>
        <a class="btn btn-primary" th:href="@{/}" th:text="#{error.back.home}">Nazad na početnu</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
