<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.5xx.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="empty-state">
        <span class="error-code" th:text="${status}">500</span>
        <h1 class="h3" th:text="#{error.5xx.heading}">Došlo je do greške</h1>
        <p th:text="#{error.5xx.text}">Pokušajte ponovo za nekoliko trenutaka.</p>
        <a class="btn btn-primary" th:href="@{/}" th:text="#{error.back.home}">Nazad na početnu</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
