<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{home.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="hero">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-7">
                <p class="hero-eyebrow" th:text="#{home.hero.eyebrow}">Dobro došli</p>
                <h1 class="display-5 fw-bold" th:text="#{home.hero.title}">Sve što vam treba, na jednom mestu.</h1>
                <p class="lead" th:text="#{home.hero.subtitle}">Pregledajte ponudu i poručite za nekoliko klikova.</p>
                <a class="btn btn-accent btn-lg mt-2" th:href="@{/products}">
                    <span th:text="#{home.hero.cta}">Pogledaj proizvode</span> <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</section>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="alert alert-info" role="alert" th:if="${param.logout}" th:text="#{logout.success}">Odjavljeni ste.</div>

    <section class="mb-5" th:unless="${#lists.isEmpty(categories)}">
        <h2 class="section-title" th:text="#{home.categories}">Kategorije</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3" th:each="category : ${categories}">
                <a class="category-tile" th:href="@{/products(categoryId=${category.id})}">
                    <span class="category-tile-name" th:text="${category.name}">Kategorija</span>
                    <span class="category-tile-desc" th:text="${category.description}">Opis</span>
                </a>
            </div>
        </div>
    </section>

    <section class="mb-5" th:unless="${#lists.isEmpty(featuredProducts)}">
        <h2 class="section-title" th:text="#{home.featured}">Izdvojeni proizvodi</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
            <div class="col" th:each="item : ${featuredProducts}">
                <div th:replace="~{fragments/components :: productCard(${item})}"></div>
            </div>
        </div>
    </section>

    <section class="mb-4">
        <div class="d-flex justify-content-between align-items-baseline">
            <h2 class="section-title" th:text="#{home.latest}">Najnoviji proizvodi</h2>
            <a th:href="@{/products}" th:text="#{home.all.products}">Svi proizvodi</a>
        </div>
        <p class="text-muted" th:if="${#lists.isEmpty(latestProducts)}" th:text="#{products.empty}">Nema proizvoda.</p>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
            <div class="col" th:each="item : ${latestProducts}">
                <div th:replace="~{fragments/components :: productCard(${item})}"></div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
