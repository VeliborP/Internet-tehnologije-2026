<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{checkout.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h3 mb-2" th:text="#{checkout.heading}">Potvrda porudžbine</h1>
    <p class="text-muted" th:text="#{checkout.intro}">Proverite stavke i potvrdite porudžbinu.</p>

    <div class="alert alert-warning" role="alert" th:unless="${#lists.isEmpty(notices)}">
        <p class="fw-semibold mb-1"><i class="bi bi-info-circle"></i> <span th:text="#{checkout.notices}">Korpa je ažurirana:</span></p>
        <ul class="mb-0">
            <li th:each="notice : ${notices}" th:text="${notice}">Obaveštenje</li>
        </ul>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{cart.column.product}">Proizvod</th>
                            <th scope="col" class="text-end" th:text="#{cart.column.price}">Cena</th>
                            <th scope="col" class="text-center" th:text="#{cart.column.quantity}">Količina</th>
                            <th scope="col" class="text-end" th:text="#{cart.column.total}">Ukupno</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cart.items}">
                            <td>
                                <span class="fw-semibold" th:text="${item.productName}">Proizvod</span>
                                <div class="small text-muted" th:text="${item.productCode}">ABC-001</div>
                            </td>
                            <td class="text-end"><span th:replace="~{fragments/components :: price(${item.unitPrice})}"></span></td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end fw-semibold"><span th:replace="~{fragments/components :: price(${item.lineTotal})}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card summary-card">
                <div class="card-body">
                    <h2 class="h5" th:text="#{checkout.summary}">Ukupno za plaćanje</h2>
                    <p class="display-6 fw-bold mb-1">
                        <span th:replace="~{fragments/components :: price(${cart.totalAmount})}"></span>
                    </p>
                    <p class="small text-muted" th:text="#{checkout.payment.note}">Plaćanje pouzećem.</p>
                    <form method="post" th:action="@{/checkout/confirm}">
                        <button class="btn btn-primary btn-lg w-100" type="submit">
                            <i class="bi bi-bag-check"></i> <span th:text="#{checkout.confirm}">Potvrdi porudžbinu</span>
                        </button>
                    </form>
                    <a class="btn btn-link w-100 mt-2" th:href="@{/cart}" th:text="#{checkout.back}">Nazad na korpu</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
