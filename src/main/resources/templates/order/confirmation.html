<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{confirmation.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card confirmation-card text-center">
                <div class="card-body p-4 p-md-5">
                    <i class="bi bi-check-circle-fill confirmation-icon"></i>
                    <h1 class="h3 mt-3" th:text="#{confirmation.heading}">Hvala na porudžbini!</h1>
                    <p class="text-muted" th:text="#{confirmation.text}">Vaša porudžbina je uspešno primljena.</p>
                    <p class="fs-5 mb-1">
                        <span th:text="#{order.number}">Broj porudžbine</span>:
                        <strong th:text="${order.orderNumber}">ORD-20260101-ABC123</strong>
                    </p>
                    <p class="fs-5">
                        <span th:text="#{order.total}">Ukupan iznos</span>:
                        <strong><span th:replace="~{fragments/components :: price(${order.totalAmount})}"></span></strong>
                    </p>

                    <div class="table-responsive text-start mt-4">
                        <table class="table table-sm align-middle">
                            <thead>
                            <tr>
                                <th scope="col" th:text="#{cart.column.product}">Proizvod</th>
                                <th scope="col" class="text-center" th:text="#{cart.column.quantity}">Količina</th>
                                <th scope="col" class="text-end" th:text="#{cart.column.total}">Ukupno</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${order.items}">
                                <td th:text="${item.productName}">Proizvod</td>
                                <td class="text-center" th:text="${item.quantity}">1</td>
                                <td class="text-end"><span th:replace="~{fragments/components :: price(${item.totalPrice})}"></span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mt-3">
                        <a class="btn btn-primary" th:href="@{/orders/{id}(id=${order.id})}"
                           th:text="#{confirmation.view.order}">Pogledaj porudžbinu</a>
                        <a class="btn btn-outline-primary" th:href="@{/products}"
                           th:text="#{cart.continue.shopping}">Nastavi kupovinu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
