<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{profile.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h3 mb-4" th:text="#{profile.heading}">Moj profil</h1>

    <div class="row g-4">
        <div class="col-md-7 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-5" th:text="#{field.first.name}">Ime</dt>
                        <dd class="col-7" th:text="${user.firstName}">Petar</dd>
                        <dt class="col-5" th:text="#{field.last.name}">Prezime</dt>
                        <dd class="col-7" th:text="${user.lastName}">Petrović</dd>
                        <dt class="col-5" th:text="#{field.username}">Korisničko ime</dt>
                        <dd class="col-7" th:text="${user.username}">kupac</dd>
                        <dt class="col-5" th:text="#{field.role}">Uloga</dt>
                        <dd class="col-7 mb-0" th:text="#{${'role.' + user.role}}">Kupac</dd>
                    </dl>
                </div>
                <div class="card-footer bg-transparent d-flex flex-wrap gap-2">
                    <a class="btn btn-primary" th:href="@{/profile/edit}">
                        <i class="bi bi-pencil"></i> <span th:text="#{profile.edit}">Izmeni podatke</span>
                    </a>
                    <a class="btn btn-outline-primary" th:href="@{/orders}">
                        <i class="bi bi-receipt"></i> <span th:text="#{nav.orders}">Moje porudžbine</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
